<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Events | Rekindle & Rise</title><link rel="stylesheet" href="/styles.css" /></head>
<body data-page="events"><div class="app-shell"><header class="hero"><div class="brand-block"><img class="brand-logo" src="/logo.jpg" alt="Rekindle & Rise logo" /><div><p class="eyebrow">Gather gently</p><h1>Events</h1><p class="subtitle">Verified activities, circles, and moments of connection.</p></div></div><button id="loginBtn" class="secondary" type="button">Sign out</button></header><nav class="bottom-tabs" aria-label="Application sections"><a class="bottom-tab" href="/dashboard.html">Dashboard</a><a class="bottom-tab" href="/journal.html">Journal</a><a class="bottom-tab" href="/community.html">Community</a><a class="bottom-tab is-active" href="/events.html">Events</a><a class="bottom-tab" href="/profile.html">Profile</a><a class="bottom-tab" href="/settings.html">Settings</a></nav><main id="mainContent" class="grid page-grid"><section class="card area-events"><h2>Upcoming events</h2><img class="section-banner" src="/events-banner.png" alt="" /><div id="eventState" class="state-loading">Loading upcoming events...</div><div class="event-discovery-tools"><input id="eventSearch" aria-label="Search events" placeholder="Search by title, location, or topic" /><select id="eventTopicFilter"><option value="">All topics</option></select><select id="eventFormatFilter"><option value="">All formats</option><option value="online">Online</option><option value="in-person">In-person</option><option value="hybrid">Hybrid</option></select><input id="eventLocationFilter" aria-label="Filter events by location" placeholder="Location" /><input id="eventFromFilter" aria-label="Filter events from date" type="date" /><input id="eventToFilter" aria-label="Filter events to date" type="date" /></div><div class="view-toggle" role="tablist" aria-label="Event views"><button type="button" class="view-toggle-btn active" data-event-view="list">List</button><button type="button" class="view-toggle-btn" data-event-view="calendar">Calendar</button><button type="button" class="view-toggle-btn" data-event-view="map">Map</button></div><div class="event-meta" id="eventMeta">Explore the schedule.</div><div class="event-layout"><div><div class="event-view" id="eventCalendar" hidden></div><div class="event-view" id="eventMap" hidden></div><div class="event-list" id="eventList"></div></div><div class="event-detail" id="eventDetail"><div id="eventDetailState" class="state-empty">Select an event to view details.</div><div id="eventDetailBody"></div></div></div></section></main></div><script src="/app.js"></script></body></html>
