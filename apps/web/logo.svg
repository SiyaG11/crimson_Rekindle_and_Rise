<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rekindle &amp; Rise logo</title>
  <desc id="desc">Circular seal with phoenix icon and curved text reading REKINDLE and &amp; RISE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6eddb"/>
      <stop offset="100%" stop-color="#f3e8d0"/>
    </linearGradient>
    <linearGradient id="phoenixMain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9528"/>
      <stop offset="100%" stop-color="#d95a16"/>
    </linearGradient>
    <linearGradient id="phoenixGlow" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd07a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ef7b1f" stop-opacity="0.15"/>
    </linearGradient>

    <path id="arcTop" d="M 80 256 A 176 176 0 0 1 432 256"/>
    <path id="arcBottom" d="M 432 256 A 176 176 0 0 1 80 256"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="224" fill="#f7efdf"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#4f2e1f" stroke-width="12"/>

  <text fill="#3e2217" font-size="72" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="6">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">REKINDLE</textPath>
  </text>
  <text fill="#3e2217" font-size="72" font-family="Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="6">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">&amp; RISE</textPath>
  </text>

